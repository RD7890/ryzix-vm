name: Build Ryzix VM APK

on:
  push:
    branches:
      - "main"
      - "dev"
      - "release/**"
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ "main", "dev" ]
    paths-ignore:
      - '**.md'
  workflow_dispatch: { }

permissions:
  contents: write

jobs:
  build_release_apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Cancel previous runs
        uses: styfle/cancel-workflow-action@0.12.1
        with:
          access_token: ${{ github.token }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Download Gradle wrapper jar
        run: |
          mkdir -p gradle/wrapper
          curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
            "https://github.com/gradle/gradle/raw/refs/tags/v8.9.0/gradle/wrapper/gradle-wrapper.jar" \
            || true
          if [ ! -s gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Primary download failed, using distribution fallback..."
            wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip -O /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp/
            cp /tmp/gradle-8.9/lib/gradle-wrapper-*.jar gradle/wrapper/gradle-wrapper.jar 2>/dev/null \
              || /tmp/gradle-8.9/bin/gradle wrapper --gradle-version 8.9 --distribution-type bin
          fi
          echo "Wrapper jar size: $(wc -c < gradle/wrapper/gradle-wrapper.jar) bytes"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-v4-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml', '**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-v4-
            ${{ runner.os }}-gradle-

      # Download Limbo's pre-built QEMU 5.1.0 ARM64 libraries.
      # This is the real QEMU — no cross-compile needed.
      # Limbo v6.0.1 ships libqemu-system-x86_64.so + all deps for arm64-v8a.
      - name: Download Limbo QEMU libraries (pre-built, QEMU 5.1.0)
        run: |
          echo "Downloading Limbo x86 APK (QEMU 5.1.0, arm64-v8a host)..."
          curl -fsSL \
            "https://github.com/limboemu/limbo/releases/download/v6.0.1-LimboEmulator/limbo-android-x86-6.0.1-qemu-5.1.0.apk" \
            -o /tmp/limbo.apk
          echo "Downloaded: $(wc -c < /tmp/limbo.apk) bytes"

          mkdir -p app/src/main/jniLibs/arm64-v8a

          python3 - <<'PYEOF'
import zipfile, os

apk = '/tmp/limbo.apk'
out = 'app/src/main/jniLibs/arm64-v8a'
os.makedirs(out, exist_ok=True)

with zipfile.ZipFile(apk) as z:
    for name in z.namelist():
        if name.startswith('lib/arm64-v8a/') and name.endswith('.so'):
            fname = os.path.basename(name)
            data = z.read(name)
            with open(os.path.join(out, fname), 'wb') as f:
                f.write(data)
            print(f'  Extracted: {fname} ({len(data)//1024} KB)')
PYEOF

          echo ""
          echo "=== arm64-v8a native libs ==="
          ls -lh app/src/main/jniLibs/arm64-v8a/

      - name: Generate signing keystore
        run: |
          mkdir -p signing
          keytool -genkey -v \
            -keystore signing/signing-key.jks \
            -alias RyzixVM \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass ryzixvm123 -keypass ryzixvm123 \
            -dname "CN=Ryzix VM,OU=Android,O=Ryzix,L=Unknown,S=Unknown,C=US" \
            2>&1 | tail -3

      - name: Create local.properties
        run: |
          echo "signing.storeFile=signing/signing-key.jks" > local.properties
          echo "signing.storePassword=ryzixvm123" >> local.properties
          echo "signing.keyAlias=RyzixVM" >> local.properties
          echo "signing.keyPassword=ryzixvm123" >> local.properties
          echo "sdk.dir=$ANDROID_HOME" >> local.properties

      - name: Build Release APK
        env:
          SIGNING_STORE_PASSWORD: "ryzixvm123"
          SIGNING_KEY_PASSWORD: "ryzixvm123"
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          ./gradlew :app:assembleRelease \
            -Pandroid.ndkPath=$ANDROID_NDK_HOME \
            --no-daemon \
            --stacktrace \
            2>&1 | tee /tmp/gradle-release.log
          echo "Exit code: ${PIPESTATUS[0]}"
          tail -30 /tmp/gradle-release.log
          grep -q "BUILD SUCCESSFUL" /tmp/gradle-release.log

      - name: Build Debug APK (fallback if release fails)
        if: failure()
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          ./gradlew :app:assembleDebug \
            -Pandroid.ndkPath=$ANDROID_NDK_HOME \
            --no-daemon \
            --stacktrace \
            2>&1 | tee /tmp/gradle-debug.log
          grep -q "BUILD SUCCESSFUL" /tmp/gradle-debug.log

      - name: Collect APKs
        if: always()
        run: |
          mkdir -p output
          find app/build/outputs/apk -name "*.apk" -exec cp {} output/ \; 2>/dev/null || true
          echo "=== Output APKs ==="
          ls -lh output/ || echo "No APKs found"

      - name: Get version name
        id: version
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/' || echo "1.0.0")
          echo "name=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ryzix-vm-apk-${{ github.run_number }}
          path: output/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Create GitHub Release
        if: (success() || failure()) && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}-build.${{ github.run_number }}
          name: "Ryzix VM v${{ steps.version.outputs.name }} (Build #${{ github.run_number }})"
          body: |
            ## Ryzix VM — Android Virtual Machine

            **Automated build**
            - Branch: `${{ github.ref_name }}`
            - Commit: `${{ github.sha }}`
            - Build: #${{ github.run_number }}

            ## What's inside
            - Real QEMU 5.1.0 (Limbo/Android build, x86_64 guest)
            - Runs x86_64 Linux VMs via JNI + dlopen
            - VNC display (connect with any VNC client on port 5900)

            ## Install
            1. Download the APK below
            2. Enable "Install from unknown sources" on your device
            3. Install and open

            ## First run
            1. Download a Linux ISO (Tiny Core Linux ~100 MB for testing)
            2. Create a VM, set ISO path, hit Start
            3. Display auto-connects via the built-in VNC client
          draft: false
          prerelease: true
          files: output/*.apk
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
