name: Build Ryzix VM APK

on:
  push:
    branches:
      - "main"
      - "dev"
      - "release/**"
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ "main", "dev" ]
    paths-ignore:
      - '**.md'
  workflow_dispatch: { }

permissions:
  contents: write

jobs:
  build_release_apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Cancel previous runs
        uses: styfle/cancel-workflow-action@0.12.1
        with:
          access_token: ${{ github.token }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Download Gradle wrapper jar
        run: |
          mkdir -p gradle/wrapper
          curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
            "https://github.com/gradle/gradle/raw/v8.9.0/gradle/wrapper/gradle-wrapper.jar" \
            || curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
            "https://services.gradle.org/distributions/gradle-8.9-bin.zip.sha256" \
            || true
          # Try alternative: use gradle to generate wrapper
          if [ ! -s gradle/wrapper/gradle-wrapper.jar ]; then
            wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip -O /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp/
            /tmp/gradle-8.9/bin/gradle wrapper --gradle-version 8.9 --distribution-type bin
          fi
          ls -la gradle/wrapper/

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-v2-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Restore QEMU build cache
        uses: actions/cache@v4
        id: qemu-cache
        with:
          path: qemu-android-build
          key: ${{ runner.os }}-qemu-limbo-arm64-v2-${{ hashFiles('.github/workflows/build.yml') }}

      - name: Install QEMU build dependencies
        if: steps.qemu-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            git ninja-build python3 python3-pip \
            libglib2.0-dev libfdt-dev libpixman-1-dev \
            zlib1g-dev flex bison pkg-config meson wget unzip

      - name: Clone Limbo QEMU source
        if: steps.qemu-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 https://github.com/limboemu/limbo.git limbo-src

      - name: Build QEMU for Android ARM64
        if: steps.qemu-cache.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          mkdir -p qemu-android-build
          NDK=$ANDROID_NDK_HOME
          TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64
          API=26
          TARGET=aarch64-linux-android

          export CC=$TOOLCHAIN/bin/${TARGET}${API}-clang
          export CXX=$TOOLCHAIN/bin/${TARGET}${API}-clang++
          export AR=$TOOLCHAIN/bin/llvm-ar
          export RANLIB=$TOOLCHAIN/bin/llvm-ranlib
          export STRIP=$TOOLCHAIN/bin/llvm-strip

          # Try Limbo's build system first
          LIMBO_JNI="limbo-src/limbo-android-lib/src/main/jni"
          if [ -f "$LIMBO_JNI/build-qemu.sh" ]; then
            echo "Using Limbo build script..."
            cd $LIMBO_JNI
            chmod +x *.sh 2>/dev/null || true
            NDK_HOME=$NDK ./build-qemu.sh arm64-v8a 2>&1 | tail -50
            cd $GITHUB_WORKSPACE
            find limbo-src -name "*.so" -exec cp {} qemu-android-build/ \; 2>/dev/null || true
            find limbo-src -name "*.a" -exec cp {} qemu-android-build/ \; 2>/dev/null || true
          else
            echo "Limbo build script not found, trying QEMU source in limbo..."
            QEMU_SRC=$(find limbo-src -name "configure" -path "*/qemu*" | head -1 | xargs dirname 2>/dev/null || echo "")
            if [ -z "$QEMU_SRC" ]; then
              echo "Fetching QEMU 8.2 source..."
              git clone --depth=1 --branch v8.2.0 https://github.com/qemu/qemu.git qemu-src
              QEMU_SRC="qemu-src"
            fi
            cd $QEMU_SRC
            mkdir -p build-android && cd build-android
            ../configure \
              --cc=$CC --cxx=$CXX --ar=$AR --ranlib=$RANLIB \
              --static \
              --target-list="aarch64-softmmu" \
              --disable-sdl --disable-gtk --disable-opengl \
              --disable-docs --disable-werror \
              --enable-vnc --disable-vnc-sasl \
              2>&1 | tail -30
            make -j$(nproc) 2>&1 | tail -80
            cd $GITHUB_WORKSPACE
            find qemu-src -name "*.so" -exec cp {} qemu-android-build/ \; 2>/dev/null || true
          fi
          echo "=== QEMU build output ==="
          ls -la qemu-android-build/ || echo "No output files"

      - name: Copy QEMU libs to jniLibs
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          if ls qemu-android-build/*.so 2>/dev/null; then
            cp qemu-android-build/*.so app/src/main/jniLibs/arm64-v8a/ || true
            echo "Copied .so files:"
            ls -la app/src/main/jniLibs/arm64-v8a/
          else
            echo "No prebuilt .so found — stub mode (QEMU_AVAILABLE=0)"
          fi

      - name: Generate signing keystore
        run: |
          mkdir -p signing
          keytool -genkey -v \
            -keystore signing/signing-key.jks \
            -alias RyzixVM \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass ryzixvm123 -keypass ryzixvm123 \
            -dname "CN=Ryzix VM,OU=Android,O=Ryzix,L=Unknown,S=Unknown,C=US" \
            2>&1 | tail -3

      - name: Create local.properties
        run: |
          echo "signing.storeFile=signing/signing-key.jks" > local.properties
          echo "signing.storePassword=ryzixvm123" >> local.properties
          echo "signing.keyAlias=RyzixVM" >> local.properties
          echo "signing.keyPassword=ryzixvm123" >> local.properties
          echo "sdk.dir=$ANDROID_HOME" >> local.properties

      - name: Build Release APK
        env:
          SIGNING_STORE_PASSWORD: "ryzixvm123"
          SIGNING_KEY_PASSWORD: "ryzixvm123"
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          ./gradlew :app:assembleRelease \
            -Pandroid.ndkPath=$ANDROID_NDK_HOME \
            --no-daemon \
            --stacktrace \
            2>&1 | tail -150

      - name: Build Debug APK (fallback if release fails)
        if: failure()
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          ./gradlew :app:assembleDebug \
            -Pandroid.ndkPath=$ANDROID_NDK_HOME \
            --no-daemon \
            --stacktrace \
            2>&1 | tail -150

      - name: Collect APKs
        run: |
          mkdir -p output
          find app/build/outputs/apk -name "*.apk" -exec cp {} output/ \; 2>/dev/null || true
          echo "=== Output APKs ==="
          ls -lh output/ || echo "No APKs found"

      - name: Get version name
        id: version
        run: |
          VERSION="1.0.0"
          echo "name=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ryzix-vm-apk-${{ github.run_number }}
          path: output/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}-build.${{ github.run_number }}
          name: "Ryzix VM v${{ steps.version.outputs.name }} (Build #${{ github.run_number }})"
          body: |
            ## Ryzix VM — Android Virtual Machine

            **Automated build**
            - Branch: `${{ github.ref_name }}`
            - Commit: `${{ github.sha }}`
            - Build: #${{ github.run_number }}

            ## Install
            1. Download APK below
            2. Allow unknown sources on your phone
            3. Install and open

            ## First run
            1. Download a Linux image (Tiny Core ~100MB for test, Debian 12 XFCE ~700MB for full)
            2. Create a VM, set image path
            3. Start VM — display auto-connects via built-in VNC

            > If QEMU build failed in CI, app runs in stub mode (UI works, no actual VM).
          draft: false
          prerelease: true
          files: output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
